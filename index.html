<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الرادار">
<meta name="theme-color" content="#0C2230">
<title>الرادار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0C2230; --deep:#07161F; --panel:#11303E; --line:#1E4454;
  --sand:#EDE3CF; --mist:#94ADB9; --brass:#D6AB55; --sage:#7CC2A6;
  --steel:#8FA9B8; --coral:#EC6F5C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sea);color:var(--sand);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--mist)}

/* Regime */
.regime{padding:10px 0 16px;border-bottom:1px solid var(--line)}
.regime .word{font-size:56px;font-weight:700;line-height:1.05}
.regime[data-mode="attack"] .word{color:var(--sage)}
.regime[data-mode="selective"] .word{color:var(--brass)}
.regime[data-mode="defense"] .word{color:var(--coral)}
.regime[data-mode="none"] .word{color:var(--mist)}
.regime .cap{font-size:14px;color:var(--mist);margin-top:2px}
.gauge{position:relative;height:8px;background:var(--panel);border-radius:4px;margin:16px 0 4px}
.gauge .fill{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:4px;background:var(--sand)}
.gauge .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--mist);opacity:.7}
.gauge-labels{position:relative;height:18px;font-size:11px;color:var(--mist)}
.gauge-labels span{position:absolute;transform:translateX(50%)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--mist);margin-top:8px}
.facts b{color:var(--sand);font-weight:600}

/* Scan */
.scan{display:block;width:100%;margin:16px 0 10px;padding:16px;border:0;border-radius:14px;background:var(--sand);color:var(--deep);font-size:18px;font-weight:700;cursor:pointer}
.scan:disabled{background:var(--panel);color:var(--mist);cursor:default}
.bar{height:4px;background:var(--panel);border-radius:2px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--brass);transition:width .25s}
.status{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mist)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.stale{color:var(--brass)}
.alert{margin:12px 0;padding:12px 14px;border-radius:12px;background:rgba(236,111,92,.12);border:1px solid rgba(236,111,92,.45);font-size:14px}
.note{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--mist)}

/* Picks */
.group{margin-top:22px}
.group h2{font-size:15px;font-weight:600;color:var(--mist);margin-bottom:4px}
.row{border-inline-start:4px solid var(--steel);padding:12px 12px 12px 4px;padding-inline-start:12px;border-bottom:1px solid var(--line);cursor:pointer}
.row[data-tier="3"]{border-inline-start-color:var(--brass)}
.row[data-tier="2"]{border-inline-start-color:var(--sage)}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sym{font-size:21px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.sym small{font-size:13px;font-weight:500;color:var(--mist);margin-inline-start:4px}
.tier{font-size:13.5px;font-weight:600}
.row[data-tier="3"] .tier{color:var(--brass)}
.row[data-tier="2"] .tier{color:var(--sage)}
.row[data-tier="1"] .tier{color:var(--steel)}
.row[data-tier="0"]{border-style:dashed;opacity:.9}
.row[data-tier="0"] .tier{color:var(--mist)}
.flag.gap{color:var(--sand);border:1px dashed var(--mist);background:transparent}
.sigs{display:flex;gap:6px;margin:8px 0 10px;direction:ltr;justify-content:flex-end}
.sig{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);color:var(--mist)}
.sig.on{background:var(--sand);border-color:var(--sand);color:var(--deep)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--mist)}
.levels b{display:block;font-size:14.5px;font-weight:600;color:var(--sand)}
.levels .neg{color:var(--coral)} .levels .pos{color:var(--sage)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--panel);color:var(--mist)}
.flag.warn{color:var(--coral)} .flag.gold{color:var(--brass)}
.risk{font-size:13px;font-weight:600;margin-top:4px}
.risk span{font-weight:400;color:var(--mist)}
.risk[data-lv="low"]{color:var(--sage)} .risk[data-lv="mid"]{color:var(--brass)} .risk[data-lv="high"]{color:var(--coral)}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mist)}
.detail dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.detail dd{color:var(--sand);text-align:left}
.detail a{color:var(--brass);display:inline-block;margin-top:10px}
.legend{margin-top:22px;font-size:13px;color:var(--mist)}
.legend summary{cursor:pointer;color:var(--sand)}
.legend p{margin-top:6px}
.excl{margin-top:14px;font-size:13px;color:var(--mist)}
.excl summary{cursor:pointer}
.excl ul{list-style:none;margin-top:6px}
.excl li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
.empty{margin-top:28px;font-size:16px;color:var(--mist)}
.empty b{display:block;color:var(--sand);font-size:18px;margin-bottom:4px}

/* Journal */
h3{font-size:17px;font-weight:700;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--mist);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
.meter{height:4px;background:var(--panel);border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--steel)}
.jrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.win{color:var(--sage)} .loss{color:var(--coral)} .exp{color:var(--mist)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.seg .btn{margin:0;padding:6px 12px;font-size:13px}
.seg .btn.on{background:var(--sand);color:var(--deep);border-color:var(--sand);font-weight:600}

/* Settings */
label{display:block;font-size:14px;margin:18px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
textarea,input[type=text]{direction:ltr}
textarea{min-height:96px}
.btn{display:inline-block;margin:10px 8px 0 0;margin-inline:0 8px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{color:var(--coral);border-color:rgba(236,111,92,.5)}
.help{font-size:13px;color:var(--mist);margin-top:6px}
pre{white-space:pre-wrap;direction:ltr;text-align:left;background:var(--deep);border-radius:10px;padding:12px;font-size:12px;margin-top:8px;overflow-x:auto}
.conn li{list-style:none;font-size:13px;padding:4px 0;direction:ltr;text-align:left}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:13px 0 11px;font-size:15px;color:var(--mist);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--sand);font-weight:700;box-shadow:inset 0 2px 0 var(--brass)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="picks">الفرص</button>
  <button role="tab" data-tab="journal">السجل</button>
  <button role="tab" data-tab="settings">الإعدادات</button>
</nav>
<script>
'use strict';

/* ===================== الإعدادات الأساسية ===================== */
const CFG = {
  bases: ['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com','https://api2.binance.com','https://api3.binance.com','https://api4.binance.com'],
  conc: 6, timeoutMs: 12000, cooldownSec: 60, safeWeight: 3000,
  minVol: 5e6, minVolLow: 1.5e6, maxUniverse: 110,
  chaseMax: 15, spreadMax: 0.15, minDays: 30,
  A: { hours: 48, ratio: 0.53, minMove: 0, maxMove: 8 },
  B: { vol: 1.3, surge: 2.0, follow: 0.8, size: 2, suspect: 3 },
  // بوابة v1 تُحسب فقط لتكون أساس الوقف والهدف الأصليين في السجل
  D: { stLen: 10, stMult: 3, atrLen: 14, swing: 12, minTarget: 5, minRR: 2, maxStop: 12, pivot: 3, look: 180 },
  // v2: وقف خارج ضجيج السوق، وهدف في مدى الحركة الفعلي
  V2: { stopAtr: 2, maxStop: 14, reachAtr: 2, minTarget: 4, minRR: 0.4, pullAtr: 1.0, pullTTLh: 24, brkAtr: 1, actAtr: 1, trailAtr: 2 },
  // قياس الأداء: الرسوم ذهابًا وإيابًا تُخصم من كل الخطط، وقواعد الحكم على الخطة H محددة مسبقًا
  fee: 0.2,
  TEST: { scans: 30, weak: 5, adopt: 0.15, drop: 0.05 },
  // ملاحظة الخطورة: نقاط من حالة السوق وجودة الإشارة. 0–1 منخفضة، 2 متوسطة، 3+ عالية
  RISK: { btcDay: -3, btc4h: -1.5, breadth: 50, wideStop: 12, mid: 2, high: 3 },
  // ترتيب القوة النسبية بين كل العملات (يُسجَّل للاختبار ولا يدخل في التصنيف بعد)
  RS: { d1: 7, d2: 14 },
  regime: { attack: 55, defense: 35 },
  journal: { horizonDays: 7, maxEval: 40, sample: 40 },
  near: { max: 3 },
};
const W = { ping: 1, ticker: 80, book: 4, klines: 2 };
const NEVER = new Set(['BTC','USDC','FDUSD','TUSD','USDP','DAI','BUSD','EUR','AEUR','EURI','USD1','PYUSD','XUSD','RLUSD','USDE','USDS','BFUSD','UST','USTC','PAX','GBP','TRY','BRL','ARS','WBTC','WBETH','BETH','BNSOL','PAXG','XAUT']);
const DEFAULT_EXCLUDE = 'DOGE, SHIB, PEPE, FLOKI, BONK, WIF, BOME, MEME, PEOPLE, TURBO, NEIRO, 1000SATS, 1MBABYDOGE, TRUMP, PNUT, ACT, GOAT, DOGS, MUBARAK, BROCCOLI714, TST';
const TIER = { 3: 'ممتاز', 2: 'جيد جدًا', 1: 'جيد', 0: 'مراقبة' };
const MODE = {
  attack:    { word: 'هجوم',    cap: 3, note: 'السوق يدعم الصفقات. كل الفئات متاحة.' },
  selective: { word: 'انتقائي', cap: 2, note: 'السوق مختلط. أعلى فئة معروضة: جيد جدًا.' },
  defense:   { word: 'دفاع',    cap: 1, note: 'السيولة تنسحب. أعلى فئة معروضة: جيد، وبحجم أصغر.' },
};
const PLN = { P: 'limit + هدف (المعتمد)', W: 'فوري + هدف', H: 'limit أو اختراق + وقف متحرك (اختبار)', A: 'مرجع v1' };
const PLANS = ['P', 'W', 'H', 'A'];

/* ===================== التخزين ===================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('radar.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('radar.' + k, JSON.stringify(v)); return true; } catch (e) { S.storageErr = true; return false; } },
};

const S = {
  tab: 'picks', running: false, progress: null, base: null, weight: 0, requests: 0,
  abort: null, error: null, open: {}, conn: null, exportText: null, msg: null,
  settings: null, last: null, journal: [], cooldownUntil: 0, haltUntil: 0,
  vp: 'P', bf: null, bfMsg: null,
};
function loadState() {
  S.settings = Object.assign({ exclude: DEFAULT_EXCLUDE, proxy: '', riskUsd: 10 }, store.get('settings', {}));
  S.last = store.get('last', null);
  S.journal = store.get('journal', []);
  for (const j of S.journal) {
    if (j.pl) { delete j.pl.S; delete j.pl.R; delete j.pl.T; }
    if (j.alt) { delete j.alt.S; delete j.alt.R; delete j.alt.T; }
  }
  S.cooldownUntil = store.get('cooldown', 0);
  S.haltUntil = store.get('halt', 0);
}
const ap = r => r.V || r.D;
const thr = () => CFG.V2;

/* ===================== أدوات ===================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtP(p) {
  if (!isFinite(p)) return '—';
  if (p >= 1000) return p.toFixed(2);
  if (p >= 1) return p.toFixed(4);
  if (p >= 0.0001) return Number(p.toPrecision(5)).toString();
  return p.toFixed(8);
}
const fmtPct = (x, d = 1) => (x > 0 ? '+' : '') + x.toFixed(d) + '%';
const fmtR = x => (x > 0 ? '+' : '') + x.toFixed(2) + 'R';
const fmtVol = v => v >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : '$' + (v / 1e6).toFixed(1) + 'M';
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'الآن';
  if (m < 60) return 'منذ ' + m + ' د';
  const h = Math.floor(m / 60);
  if (h < 48) return 'منذ ' + h + ' س';
  return 'منذ ' + Math.floor(h / 24) + ' يوم';
}

/* ===================== المؤشرات ===================== */
const parseK = raw => raw.map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], ct: k[6], qv: +k[7], n: +k[8], tb: +k[10] }));
const closedK = (ks, now = Date.now()) => ks.filter(k => k.ct < now);

function ema(v, n) {
  const out = new Array(v.length).fill(null);
  if (v.length < n) return out;
  let e = 0; for (let i = 0; i < n; i++) e += v[i]; e /= n; out[n - 1] = e;
  const k = 2 / (n + 1);
  for (let i = n; i < v.length; i++) { e = v[i] * k + e * (1 - k); out[i] = e; }
  return out;
}
function atrSeries(ks, n) {
  const out = new Array(ks.length).fill(null);
  if (ks.length < n) return out;
  const tr = ks.map((k, i) => i === 0 ? k.h - k.l : Math.max(k.h - k.l, Math.abs(k.h - ks[i - 1].c), Math.abs(k.l - ks[i - 1].c)));
  let a = 0; for (let i = 0; i < n; i++) a += tr[i]; a /= n; out[n - 1] = a;
  for (let i = n; i < ks.length; i++) { a = (a * (n - 1) + tr[i]) / n; out[i] = a; }
  return out;
}
function supertrend(ks, len, mult) {
  const atr = atrSeries(ks, len);
  const trend = new Array(ks.length).fill(null);
  let up = null, dn = null, dir = 1;
  for (let i = len - 1; i < ks.length; i++) {
    const hl2 = (ks[i].h + ks[i].l) / 2, bu = hl2 - mult * atr[i], bd = hl2 + mult * atr[i];
    if (up === null) { up = bu; dn = bd; trend[i] = dir; continue; }
    const pc = ks[i - 1].c;
    const nup = pc > up ? Math.max(bu, up) : bu;
    const ndn = pc < dn ? Math.min(bd, dn) : bd;
    if (dir === -1 && ks[i].c > ndn) dir = 1;
    else if (dir === 1 && ks[i].c < nup) dir = -1;
    up = nup; dn = ndn; trend[i] = dir;
  }
  return trend;
}
function resistances(ks, span) {
  const res = [];
  for (let i = span; i < ks.length - span; i++) {
    let ok = true;
    for (let j = i - span; j <= i + span; j++) if (j !== i && ks[j].h >= ks[i].h) { ok = false; break; }
    if (ok) res.push(ks[i].h);
  }
  return res;
}

/* ===================== الإشارات والتصنيف ===================== */
function analyze(u, d1, h4, h1, btcD) {
  const r = { sym: u.sym, base: u.base, last: u.last, qv: u.qv, chg: u.chg, spread: u.spread, low: u.qv < CFG.minVol };

  // A — طلب عدواني لم يتمدد بعد
  const a = h1.slice(-CFG.A.hours);
  const qvA = sum(a, k => k.qv), tbA = sum(a, k => k.tb);
  const ratio = qvA ? tbA / qvA : 0;
  const move = a.length ? (a[a.length - 1].c / a[0].o - 1) * 100 : 0;
  r.A = { ratio, move, pass: a.length >= CFG.A.hours && ratio >= CFG.A.ratio && move >= CFG.A.minMove && move <= CFG.A.maxMove };

  // B — مشاركة موزعة (الحجم + عدد الصفقات + حجم الصفقة الواحدة)
  if (h1.length >= 168) {
    const recent = h1.slice(-24), prior = h1.slice(-168, -24);
    const volNow = sum(recent, k => k.qv), trNow = sum(recent, k => k.n);
    const volBase = sum(prior, k => k.qv) / 6, trBase = sum(prior, k => k.n) / 6;
    const volR = volBase ? volNow / volBase : 0, trR = trBase ? trNow / trBase : 0;
    const sizes = [];
    for (let d = 0; d < 6; d++) { const ch = prior.slice(d * 24, (d + 1) * 24); const n = sum(ch, k => k.n); if (n) sizes.push(sum(ch, k => k.qv) / n); }
    const sizeBase = median(sizes), sizeR = sizeBase && trNow ? (volNow / trNow) / sizeBase : 0;
    r.B = {
      volR, trR, sizeR,
      pass: volR >= CFG.B.vol && trR >= CFG.B.follow * volR && sizeR <= CFG.B.size,
      surge: volR >= CFG.B.surge,
      suspect: volR >= 1.5 && sizeR > CFG.B.suspect,
    };
  } else r.B = { volR: 0, trR: 0, sizeR: 0, pass: false, surge: false, suspect: false };

  // C — قوة نسبية أمام BTC
  const c = d1.map(k => k.c), b = btcD.map(k => k.c);
  const ret = (arr, n) => arr[arr.length - 1] / arr[arr.length - 1 - n] - 1;
  const rel3 = (ret(c, 3) - ret(b, 3)) * 100, rel7 = (ret(c, 7) - ret(b, 7)) * 100;
  r.C = { rel3, rel7, pass: rel3 > 0 && rel7 > 0 };

  // D — صفقة صالحة (شرط إلزامي)
  const k4 = h4.slice(-CFG.D.look);
  const st = supertrend(k4, CFG.D.stLen, CFG.D.stMult);
  const stGreen = st[st.length - 1] === 1;
  const atr = atrSeries(k4, CFG.D.atrLen)[k4.length - 1] || 0;
  const entry = u.last;
  const atrPct = entry ? atr / entry * 100 : 0;
  const swingLow = Math.min(...k4.slice(-CFG.D.swing).map(k => k.l));
  let stop = swingLow * 0.995;
  if (entry - stop < atr) stop = entry - atr;
  const stopPct = (entry - stop) / entry * 100;
  const res = resistances(k4, CFG.D.pivot).filter(h => h > entry * 1.002);
  const sky = res.length === 0;
  const target = sky ? entry + 3 * atr : Math.min(...res) * 0.995;
  const targetPct = (target / entry - 1) * 100;
  const rr = entry > stop ? (target - entry) / (entry - stop) : 0;
  let why = null;
  if (!stGreen) why = 'Supertrend 4H سلبي';
  else if (targetPct < CFG.D.minTarget) why = sky ? 'حركة ضيقة لا تكفي 5%' : 'مقاومة قبل 5%';
  else if (stopPct > CFG.D.maxStop) why = 'الوقف واسع جدًا';
  else if (rr < CFG.D.minRR) why = 'العائد/المخاطرة أقل من 2';
  r.D = { pass: !why, why, stGreen, atr, atrPct, entry, stop, stopPct, target, targetPct, rr, sky };

  // D2 — نفس الدخول، لكن الوقف خارج ضجيج 4H والهدف داخل مدى الحركة
  const V = CFG.V2;
  const vStop = Math.min(stop, entry - V.stopAtr * atr);
  const vTarget = Math.min(target, entry + V.reachAtr * atr);
  const vStopPct = (entry - vStop) / entry * 100;
  const vTargetPct = (vTarget / entry - 1) * 100;
  const vRR = entry > vStop ? (vTarget - entry) / (entry - vStop) : 0;
  let vWhy = null;
  if (!stGreen) vWhy = 'Supertrend 4H سلبي';
  else if (vTargetPct < V.minTarget) vWhy = 'الهدف الواقعي أقل من ' + V.minTarget + '%';
  else if (vStopPct > V.maxStop) vWhy = 'الوقف واسع جدًا';
  else if (vRR < V.minRR) vWhy = 'العائد/المخاطرة أقل من ' + V.minRR;
  r.V = { pass: !vWhy, why: vWhy, stGreen, atr, atrPct, entry, stop: vStop, stopPct: vStopPct, target: vTarget, targetPct: vTargetPct, rr: vRR, sky };
  return r;
}

function grade(r, mode) {
  const D = ap(r);
  if (!D.pass) return { tier: 0, reason: D.why };
  if (r.low && !(r.B.pass && r.B.surge)) return { tier: 0, reason: 'سيولة ضعيفة بلا دخول حجم صحي' };
  const n = (r.B.pass ? 1 : 0) + (r.C.pass ? 1 : 0);
  if (n === 0) return { tier: 0, reason: 'صفقة بلا إشارات داعمة' };
  let tier = n === 2 ? (r.A.pass ? 3 : 2) : 1;
  if (r.B.suspect) tier = Math.min(tier, 1);
  const raw = tier;
  tier = Math.min(tier, MODE[mode].cap);
  return { tier, raw, capped: tier < raw };
}

/* قيد المراقبة: أعلى 3 تقييمًا من العملات التي لم تجتز الشروط، بلا أي حد أدنى. */
function nearMiss(r) {
  const D = ap(r), T = thr();
  const n = (r.B.pass ? 1 : 0) + (r.C.pass ? 1 : 0) + (r.A.pass ? 0.5 : 0);
  let score = n + (D.stGreen ? 1 : 0)
    + Math.min(Math.max(D.targetPct, 0) / T.minTarget, 1)
    + Math.min(Math.max(D.rr, 0) / T.minRR, 1)
    + (D.stopPct <= T.maxStop ? 1 : T.maxStop / D.stopPct);
  if (r.B.suspect) score -= 1;
  const weak = r.low && !(r.B.pass && r.B.surge);
  if (weak) score -= 1;
  const gaps = [];
  if (!D.stGreen) gaps.push('Supertrend 4H سلبي');
  if (D.targetPct < T.minTarget) gaps.push((D.sky ? 'الهدف المتوقع ' : 'المقاومة على بعد ') + D.targetPct.toFixed(1) + '%');
  if (D.stopPct > T.maxStop) gaps.push('الوقف ' + D.stopPct.toFixed(1) + '%');
  if (D.rr < T.minRR) gaps.push('العائد/المخاطرة ' + D.rr.toFixed(1));
  if (n === 0) gaps.push('لا إشارات داعمة');
  if (weak) gaps.push('سيولة ضعيفة');
  return { tier: 0, n, score, gaps };
}

/* ملاحظة الخطورة: لا تقرر عنك، تعطيك الصورة. تُسجَّل لتُختبر بالشموع. */
function riskOf(r, regime) {
  const R = CFG.RISK, x = regime.ctx || {}, why = [];
  let pts = 0;
  if (!regime.btcUp || (x.b1 != null && x.b1 <= R.btcDay) || regime.breadth < R.breadth) { pts += 2; why.push('السوق ضعيف'); }
  if (x.h4 != null && x.h4 <= R.btc4h) { pts += 1; why.push('BTC يهبط الآن'); }
  if (!r.tier || r.tier === 1) { pts += 1; why.push(r.tier ? 'إشارة واحدة' : 'لم تجتز الشروط'); }
  if (r.B.suspect || r.low) { pts += 1; why.push(r.B.suspect ? 'اشتباه ضخ' : 'سيولة استثنائية'); }
  if (ap(r).stopPct > R.wideStop) { pts += 1; why.push('وقف واسع'); }
  const lv = pts >= R.high ? 'high' : pts >= R.mid ? 'mid' : 'low';
  return { lv, pts, why };
}
const RISK_W = { low: 'منخفضة', mid: 'متوسطة', high: 'عالية' };
/* ترتيب القوة النسبية: نسبة العملات التي تتفوق عليها هذه العملة خلال 7 و14 يومًا (100 = الأقوى). */
function rsRanks(rows) {
  const ret = (c, n) => c.length > n ? c[c.length - 1] / c[c.length - 1 - n] - 1 : null;
  const v = rows.map(x => ({ sym: x.sym, a: ret(x.c, CFG.RS.d1), b: ret(x.c, CFG.RS.d2) })).filter(x => x.a != null && x.b != null);
  const pct = (arr, k) => { const s = arr.map(x => x[k]).sort((p, q) => p - q); return val => s.length > 1 ? s.filter(y => y < val).length / (s.length - 1) * 100 : 50; };
  const pa = pct(v, 'a'), pb = pct(v, 'b'), out = {};
  for (const x of v) out[x.sym] = Math.round((pa(x.a) + pb(x.b)) / 2);
  return out;
}

function regimeOf(btcD, breadth) {
  const c = btcD.map(k => k.c), e = ema(c, 50);
  const last = c.length - 1;
  const up = c[last] > e[last];
  const falling = e[last] < e[last - 5];
  let mode;
  if (breadth >= CFG.regime.attack && up) mode = 'attack';
  else if (breadth < CFG.regime.defense || (!up && falling)) mode = 'defense';
  else mode = 'selective';
  return { mode, breadth, btcUp: up, btcFalling: falling };
}

/* ===================== الاتصال بـ Binance ===================== */
class Halt extends Error { constructor(ms) { super('halt'); this.halt = true; this.ms = ms; } }
function baseList() {
  const p = (S.settings.proxy || '').trim().replace(/\/+$/, '');
  return p ? [p, ...CFG.bases] : CFG.bases;
}
function rotateBase() { const b = baseList(); const i = b.indexOf(S.base); S.base = b[(i + 1) % b.length]; }
async function fetchT(url, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(t); }
}
async function ensureBase() {
  if (S.base) return;
  for (const b of baseList()) {
    try { const r = await fetchT(b + '/api/v3/ping', 8000); if (r.ok) { S.base = b; S.weight += W.ping; return; } } catch (e) { /* next */ }
  }
  const e = new Error('conn'); e.conn = true; throw e;
}
async function api(path, w) {
  if (Date.now() < S.haltUntil) throw new Halt(S.haltUntil - Date.now());
  if (S.weight + w > CFG.safeWeight) { const e = new Error('تجاوز ميزانية الوزن الآمنة لهذا المسح'); e.fatal = true; throw e; }
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (S.abort) throw S.abort;
    const base = S.base || baseList()[0];
    let r;
    try { r = await fetchT(base + path, CFG.timeoutMs); }
    catch (e) { lastErr = new Error('انقطاع الشبكة'); rotateBase(); await sleep(500 * (attempt + 1)); continue; }
    if (r.status === 429 || r.status === 418) {
      const ra = parseInt(r.headers.get('Retry-After') || '', 10);
      const ms = (isFinite(ra) && ra > 0 ? ra : (r.status === 418 ? 300 : 120)) * 1000;
      S.haltUntil = Date.now() + ms; store.set('halt', S.haltUntil);
      throw new Halt(ms);
    }
    if (r.status >= 500) { lastErr = new Error('خطأ من خادم Binance ' + r.status); await sleep(1000 * 2 ** attempt); continue; }
    if (r.status === 451 || r.status === 403) { lastErr = new Error('المصدر رفض الطلب ' + r.status); rotateBase(); continue; }
    if (!r.ok) { const e = new Error('طلب مرفوض ' + r.status); e.skip = true; throw e; }
    S.weight += w; S.requests++;
    return r.json();
  }
  throw lastErr || new Error('تعذر الاتصال');
}
async function pool(items, n, fn, tick) {
  let i = 0, done = 0; const out = new Array(items.length);
  async function worker() {
    while (i < items.length) {
      if (S.abort) return;
      const k = i++;
      try { out[k] = await fn(items[k]); }
      catch (e) { if (e.halt || e.fatal) { S.abort = e; return; } out[k] = { err: e }; }
      done++; if (tick) tick(done, items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  if (S.abort) throw S.abort;
  return out;
}
const kl = (sym, iv, limit, start, end) => api(`/api/v3/klines?symbol=${sym}&interval=${iv}&limit=${limit}${start ? '&startTime=' + start : ''}${end ? '&endTime=' + end : ''}`, W.klines).then(parseK);

/* ===================== المسح ===================== */
function setProgress(label, frac) { S.progress = { label, frac }; renderScanArea(); }

async function scan() {
  if (S.running || S.bf) return;

  const excluded = {};

      api('/api/v3/ticker/24hr', W.ticker),
      api('/api/v3/ticker/bookTicker', W.book),
      kl('BTCUSDT', '1d', 120),
      kl('BTCUSDT', '1h', 8).catch(() => []),
    ]);

    const universe = [];
    for (const t of tick) {

      if (NEVER.has(base) || userEx.has(base)) continue;
      const qv = +t.quoteVolume, last = +t.lastPrice, open = +t.openPrice;
      if (!(last > 0) || now - t.closeTime > 2 * 3600e3) continue;
      if (qv < CFG.minVolLow) continue;
      const bk = bookMap.get(t.symbol);
      const bid = bk ? +bk.bidPrice : 0, ask = bk ? +bk.askPrice : 0;
      const spread = bid > 0 && ask > 0 ? (ask - bid) / ((ask + bid) / 2) * 100 : 99;
      universe.push({ sym: t.symbol, base, qv, last, chg: open > 0 ? (last / open - 1) * 100 : 0, spread });
    }

    setProgress('الشموع اليومية والاتساع', 0.1);
    const daily = await pool(universe, CFG.conc, u => kl(u.sym, '1d', 60),
      (d, n) => setProgress('الشموع اليومية والاتساع', 0.1 + 0.3 * d / n));

    let above = 0, counted = 0;
    const survivors = [];
    universe.forEach((u, i) => {

      const dc = closedK(d);
      if (dc.length >= 21) {
        const e = ema(dc.map(k => k.c), 20);
        counted++; if (dc[dc.length - 1].c > e[e.length - 1]) above++;
      }
      if (dc.length < CFG.minDays) { ex('إدراج حديث (أقل من 30 يومًا)'); return; }
      if (u.chg > CFG.chaseMax) { ex('مطاردة: صعدت أكثر من 15% اليوم'); return; }
      if (u.spread > CFG.spreadMax) { ex('فارق سعري واسع'); return; }
      survivors.push({ u, d1: dc });
    });
    const breadth = counted ? above / counted * 100 : 0;
    const rs = rsRanks(universe.map((u, i) => ({ sym: u.sym, c: daily[i] && !daily[i].err ? closedK(daily[i]).map(k => k.c) : [] })));
    const regime = regimeOf(btcD, breadth);
    { const bc = btcD.map(k => k.c), bl = bc.length - 1;
      regime.ctx = { br: +breadth.toFixed ? +breadth.toFixed(1) : breadth, b1: bl >= 1 ? +((bc[bl] / bc[bl - 1] - 1) * 100).toFixed(2) : null, b7: bl >= 7 ? +((bc[bl] / bc[bl - 7] - 1) * 100).toFixed(2) : null, up: regime.btcUp ? 1 : 0, fall: regime.btcFalling ? 1 : 0,
      h1: btcHc.length >= 2 ? +((btcHc[btcHc.length - 1] / btcHc[btcHc.length - 2] - 1) * 100).toFixed(2) : null,
      h4: btcHc.length >= 5 ? +((btcHc[btcHc.length - 1] / btcHc[btcHc.length - 5] - 1) * 100).toFixed(2) : null }; }

    setProgress('تحليل الفرص', 0.42);
    const jobs = [];
    survivors.forEach((s, i) => { jobs.push({ i, iv: '4h' }); jobs.push({ i, iv: '1h' }); });
    const got = await pool(jobs, CFG.conc, j => kl(survivors[j.i].u.sym, j.iv, 200),
      (d, n) => setProgress('تحليل الفرص', 0.42 + 0.45 * d / n));

    const picks = [], near = [];
    survivors.forEach((s, i) => {
      const h4 = got[i * 2], h1 = got[i * 2 + 1];
      if (!h4 || h4.err || !h1 || h1.err) { ex('تعذر جلب بياناتها'); return; }
      const c4 = closedK(h4), c1 = closedK(h1);
      if (c4.length < 60 || c1.length < 60) { ex('بيانات غير كافية'); return; }
      const r = analyze(s.u, s.d1, c4, c1, btcD);
      const g = grade(r, regime.mode);
      if (!g.tier) { ex(g.reason); near.push(Object.assign(r, nearMiss(r))); return; }
      picks.push(Object.assign(r, g));
    });
    picks.sort((x, y) => y.tier - x.tier || ap(y).rr - ap(x).rr);
    near.sort((x, y) => y.score - x.score || ap(y).rr - ap(x).rr);
    near.splice(CFG.near.max);
    for (const r of picks.concat(near)) { r.rs = rs[r.sym] != null ? rs[r.sym] : null; r.risk = riskOf(r, regime); }

    setProgress('تحديث السجل', 0.9);
    await evaluateJournal();
    addToJournal(picks.concat(near), regime.mode, regime.ctx);

    S.last = { t: Date.now(), regime, picks, near, excluded, universe: universe.length, analyzed: survivors.length, weight: S.weight, requests: S.requests, base: S.base };
    store.set('last', S.last);
    setProgress('اكتمل', 1);
  } catch (e) {
    if (e.halt) S.error = 'Binance طلبت التوقف مؤقتًا. المسح التالي متاح بعد ' + Math.ceil(e.ms / 60000) + ' دقيقة. هذا يحمي عنوانك من الحظر.';
    else if (e.conn) S.error = 'تعذر الوصول إلى Binance من هذا المتصفح. افتح الإعدادات واضغط "اختبار الاتصال".';
    else S.error = 'توقف المسح: ' + e.message + '. النتائج المعروضة هي آخر مسح ناجح.';
  } finally {
    S.running = false; S.progress = null;
    S.cooldownUntil = Date.now() + CFG.cooldownSec * 1000; store.set('cooldown', S.cooldownUntil);
    render();
  }
}

/* ===================== السجل الظلي: عدة خطط على نفس الإشارة ===================== */
/* A = مرجع v1 (الحقول المسطحة). W = دخول فوري + هدف. P = limit + هدف (المعتمد). H = limit أو اختراق، أيهما أولًا، ثم وقف متحرك بلا هدف. */
function buildPlans(a, atr) {
  const V = CFG.V2;
  if (!(atr > 0)) return {};
  const Wp = { e: a.e, s: Math.min(a.s, a.e - V.stopAtr * atr), t: Math.min(a.t, a.e + V.reachAtr * atr) };
  if (!(Wp.t > Wp.e) || !(Wp.s < Wp.e)) return {};
  return {
    W: Wp,
    P: { e: a.e - V.pullAtr * atr, s: Wp.s, t: Wp.t, ttl: V.pullTTLh * 36e5 },
    H: { lo: a.e - V.pullAtr * atr, hi: a.e + V.brkAtr * atr, s: Wp.s, atr, ttl: V.pullTTLh * 36e5 },
  };
}
function addToJournal(picks, mode, ctx) {
  const openSyms = new Set(S.journal.filter(j => j.status === 'open').map(j => j.sym));
  const t = Date.now();
  for (const p of picks) {
    if (openSyms.has(p.sym)) continue;
    const j = {
      id: p.sym + '-' + t, sym: p.sym, tier: p.tier, mode, t,
      entry: p.D.entry, stop: p.D.stop, target: p.D.target, status: 'open',
      f: { atrPct: p.D.atrPct, ratio: p.A.ratio, move: p.A.move, volR: p.B.volR, trR: p.B.trR, sizeR: p.B.sizeR, rel3: p.C.rel3, rel7: p.C.rel7, chg: p.chg, qv: p.qv, spread: p.spread, sky: p.D.sky, sigs: (p.A.pass ? 'A' : '') + (p.B.pass ? 'B' : '') + (p.C.pass ? 'C' : ''), mk: ctx || null, rs: p.rs },
      rk: p.risk ? { lv: p.risk.lv, pts: p.risk.pts } : null,
    };
    j.pl = buildPlans({ e: j.entry, s: j.stop, t: j.target }, p.D.atr);
    if (j.pl.H) j.pl.H.live = true; // صفقة جديدة: تدخل في الحكم على H
    S.journal.push(j);
  }
  store.set('journal', S.journal);
}

function mk(status, price, when, p, t0, extra) {
  return Object.assign({ status, exit: price, closeT: when, result: (price / p.e - 1) * 100, risk: (p.e - p.s) / p.e * 100, days: (when - t0) / 864e5 }, extra || {});
}
/* وقف وهدف ثابتان. إذا لمست الشمعة الاثنين تُحسب خسارة. */
function simStd(p, cs, t0, expired) {
  for (const k of cs) {
    if (k.l <= p.s) return mk('loss', p.s, k.ct, p, t0);
    if (k.h >= p.t) return mk('win', p.t, k.ct, p, t0);
  }
  if (expired && cs.length) { const k = cs[cs.length - 1]; return mk('expired', k.c, k.ct, p, t0); }
  return { status: 'open' };
}
/* H: أمران معلّقان معًا، limit تحت السعر وشراء عند الاختراق فوقه، أيهما يُنفَّذ أولًا خلال المدة.
   بعد التنفيذ لا هدف: الوقف يبقى مكانه حتى يتحرك السعر actAtr×ATR، ثم يلحق أعلى سعر بمسافة trailAtr×ATR ولا ينزل.
   الشمعة الصاعدة يُفترض أنها لمست القاع أولًا، والهابطة القمة أولًا. شمعة التنفيذ لا ترفع الوقف. */
function simH(p, cs, t0, now, expired) {
  const V = CFG.V2;
  let fi = -1, fill = 0;
  for (let i = 0; i < cs.length; i++) {
    const k = cs[i];
    if (k.t - t0 >= p.ttl) return { status: 'nofill' };
    const lo = k.l <= p.lo, hi = k.h >= p.hi;
    if (!lo && !hi) continue;
    fill = lo && hi ? (k.c >= k.o ? Math.min(p.lo, k.o) : Math.max(p.hi, k.o)) : lo ? Math.min(p.lo, k.o) : Math.max(p.hi, k.o);
    fi = i; break;
  }
  if (fi < 0) return now - t0 >= p.ttl ? { status: 'nofill' } : { status: 'pending' };
  const q = { e: fill, s: p.s }, tf = cs[fi].t;
  if (!(fill > p.s)) return { status: 'nofill' };
  if (cs[fi].l <= p.s) return mk('loss', p.s, cs[fi].ct, q, tf);
  let stop = p.s, hh = fill, on = false;
  for (let i = fi + 1; i < cs.length; i++) {
    const k = cs[i];
    if (k.l <= stop) return mk(stop > fill ? 'win' : 'loss', stop, k.ct, q, tf);
    if (k.h > hh) hh = k.h;
    if (hh >= fill + V.actAtr * p.atr) on = true;
    if (on) stop = Math.max(stop, hh - V.trailAtr * p.atr);
  }
  if (expired && cs.length) { const k = cs[cs.length - 1]; return mk('expired', k.c, k.ct, q, tf); }
  return { status: 'open' };
}
/* أمر limit عند تراجع، صالح مدة محددة. يُلغى إذا وصل الهدف قبل التنفيذ. */
function simPull(p, cs, t0, now, expired) {
  let fi = -1;
  for (let i = 0; i < cs.length; i++) {
    const k = cs[i];
    if (k.t - t0 >= p.ttl) return { status: 'nofill' };
    if (k.l <= p.e) { fi = i; break; }
    if (k.h >= p.t) return { status: 'nofill' };
  }
  if (fi < 0) return now - t0 >= p.ttl ? { status: 'nofill' } : { status: 'pending' };
  const k0 = cs[fi], tf = k0.t;
  if (k0.l <= p.s) return mk('loss', p.s, k0.ct, p, tf);
  return simStd(p, cs.slice(fi + 1), tf, expired);
}

function closeTrade(j, r) { j.status = r.status; j.exit = r.exit; j.closeT = r.closeT; j.result = r.result; j.days = r.days; }
function excursions(j, cs) {
  if (j.status === 'open' || j.mfe !== undefined || !j.closeT) return;
  let hi = j.entry, lo = j.entry;
  for (const k of cs) { if (k.ct >= j.closeT) break; if (k.h > hi) hi = k.h; if (k.l < lo) lo = k.l; }
  j.mfe = (hi / j.entry - 1) * 100; j.mae = (lo / j.entry - 1) * 100;
}
/* هل وصل السعر إلى الهدف بعد أن ضُرب الوقف (داخل نفس المدة)؟ */
function recovery(j, cs, expired) {
  if (j.status !== 'loss' || j.rec !== undefined) return;
  for (const k of cs) {
    if (k.t > j.closeT && k.h >= j.target) { j.rec = true; j.recD = (k.ct - j.t) / 864e5; return; }
  }
  if (expired) j.rec = false;
}
function runSim(j, ks, now) {
  const hz = CFG.journal.horizonDays * 864e5;
  const cs = closedK(ks, now).filter(k => k.t >= j.t && k.t - j.t < hz);
  const expired = now - j.t >= hz;
  if (j.status === 'open') {
    const r = simStd({ e: j.entry, s: j.stop, t: j.target }, cs, j.t, expired);
    if (r.status !== 'open') closeTrade(j, r);
  }
  if (j.pl) {
    j.alt = j.alt || {};
    if (j.pl.W && !j.pl.H && j.f && j.f.atrPct > 0) { const atr = j.entry * j.f.atrPct / 100; j.pl.H = { lo: j.entry - CFG.V2.pullAtr * atr, hi: j.entry + CFG.V2.brkAtr * atr, s: j.pl.W.s, atr, ttl: CFG.V2.pullTTLh * 36e5 }; }
    for (const key of ['W', 'P', 'H']) {
      const p = j.pl[key], cur = j.alt[key];
      if (!p || (cur && cur.status !== 'open' && cur.status !== 'pending')) continue;
      j.alt[key] = key === 'H' ? simH(p, cs, j.t, now, expired) : key === 'P' ? simPull(p, cs, j.t, now, expired) : simStd(p, cs, j.t, expired);
    }
  }
  excursions(j, cs);
  recovery(j, cs, expired);
}
function needsEval(j) {
  const hz = CFG.journal.horizonDays * 864e5;
  if (j.status === 'open') return true;
  if (j.pl && !j.alt) return true;
  if (j.pl && j.pl.W && !j.pl.H && j.f && j.f.atrPct > 0) return true;
  if (j.alt && Object.values(j.alt).some(a => a.status === 'open' || a.status === 'pending')) return true;
  if (j.status === 'loss' && j.rec === undefined && j.pl) return true;
  if (j.status === 'loss' && j.rec === undefined && Date.now() - j.t < hz) return true;
  return false;
}
async function evaluateJournal() {
  const list = S.journal.filter(needsEval).sort((a, b) => a.t - b.t).slice(0, CFG.journal.maxEval);
  if (!list.length) return;
  const res = await pool(list, CFG.conc, j => kl(j.sym, '1h', 250, j.t));
  const now = Date.now();
  list.forEach((j, i) => { const ks = res[i]; if (!ks || ks.err) return; runSim(j, ks, now); });
  store.set('journal', S.journal);
}

/* تحليل رجعي: يجلب الشموع من المتصفح نفسه لكل صفقة قديمة ويعيد بناء الخطط البديلة والتشخيص. */
async function backfill() {
  if (S.running || S.bf) return;
  if (Date.now() < S.haltUntil) { S.bfMsg = 'Binance طلبت التوقف مؤقتًا. حاول بعد قليل.'; render(); return; }
  const items = S.journal.filter(j => !j.pl).slice(0, 60);
  if (!items.length) { S.bfMsg = 'كل صفقات السجل محلّلة.'; render(); return; }
  S.bf = { done: 0, n: items.length }; S.bfMsg = null; S.weight = 0; S.abort = null; render();
  try {
    await ensureBase();
    await pool(items, CFG.conc, async j => {
      const [k1, k4] = await Promise.all([kl(j.sym, '1h', 250, j.t), kl(j.sym, '4h', 40, null, j.t)]);
      const c4 = closedK(k4, j.t);
      const atr = atrSeries(c4, CFG.D.atrLen).pop();
      j.pl = buildPlans({ e: j.entry, s: j.stop, t: j.target }, atr);
      if (atr > 0) j.f = Object.assign({}, j.f, { atrPct: atr / j.entry * 100 });
      runSim(j, k1, Date.now());
      j.retro = true;
    }, (d) => { S.bf.done = d; if (S.tab === 'journal') render(); });
    store.set('journal', S.journal);
    const left = S.journal.filter(j => !j.pl).length;
    S.bfMsg = 'اكتمل التحليل.' + (left ? ' تبقّت ' + left + ' صفقة، اضغط مرة أخرى.' : ' انسخ السجل من الأسفل والصقه في المحادثة.');
  } catch (e) {
    store.set('journal', S.journal);
    S.bfMsg = e.halt ? 'Binance طلبت التوقف مؤقتًا، وحُفظ ما اكتمل. أعد المحاولة بعد دقائق.' : e.conn ? 'تعذر الوصول إلى Binance. افتح الإعدادات واضغط "اختبار الاتصال".' : 'توقف التحليل: ' + e.message;
  } finally { S.bf = null; render(); }
}

/* ===================== إحصاءات السجل ===================== */
/* R لكل إشارة بعد الرسوم. الإشارة التي لم يُنفَّذ أمرها = 0. null = لم تُحسم بعد. */
function planR(j, key) {
  const fee = CFG.fee;
  if (key === 'A') return j.status === 'open' || j.result == null ? null : (j.result - fee) / ((j.entry - j.stop) / j.entry * 100);
  const a = j.alt && j.alt[key];
  if (!a) return null;
  if (a.status === 'nofill') return 0;
  if (a.risk == null || a.result == null) return null;
  return (a.result - fee) / a.risk;
}
/* الصفقات من المسح نفسه تتحرك معًا، فالمسح هو المشاهدة المستقلة: متوسط كل مسح، ثم متوسط المسوح وفترة ثقة 95%. */
function clustered(pairs) {
  const g = new Map();
  for (const [t, v] of pairs) { if (!g.has(t)) g.set(t, []); g.get(t).push(v); }
  const m = [...g.values()].map(a => sum(a, x => x) / a.length), n = m.length;
  const mean = n ? sum(m, x => x) / n : 0;
  const sd = n > 1 ? Math.sqrt(sum(m, x => (x - mean) ** 2) / (n - 1)) : 0;
  return { scans: n, mean, ci: n > 1 ? 1.96 * sd / Math.sqrt(n) : null };
}
function planStats(key, filter) {
  const list = S.journal.filter(j => !filter || filter(j));
  const pairs = [];
  let trades = 0, wins = 0, nofill = 0;
  for (const j of list) {
    const r = planR(j, key);
    if (r == null) continue;
    pairs.push([j.t, r]);
    const a = key === 'A' ? null : j.alt[key];
    if (a && a.status === 'nofill') nofill++; else { trades++; if (r > 0) wins++; }
  }
  return Object.assign(clustered(pairs), { n: pairs.length, trades, nofill, win: trades ? wins / trades * 100 : 0 });
}
const weakMk = j => j.f && j.f.mk && (j.f.mk.up === 0 || j.f.mk.br < CFG.RISK.breadth);
/* الحكم على H مقابل P: الصفقات الجديدة فقط، والفرق محسوب داخل كل مسح. */
function hTest() {
  const T = CFG.TEST, all = [], weak = [];
  for (const j of S.journal) {
    if (!(j.pl && j.pl.H && j.pl.H.live)) continue;
    const h = planR(j, 'H'), p = planR(j, 'P');
    if (h == null || p == null) continue;
    all.push([j.t, h - p]);
    if (weakMk(j)) weak.push([j.t, h - p]);
  }
  const A = clustered(all), Wk = clustered(weak);
  let verdict, cls = '';
  if (A.scans < T.scans || Wk.scans < T.weak) verdict = `قيد الاختبار: ${A.scans}/${T.scans} مسح، منها ${Wk.scans}/${T.weak} في سوق ضعيف. لا حكم قبل اكتمالهما.`;
  else if (A.mean >= T.adopt && Wk.mean > 0) { verdict = 'تُعتمد H: تفوقت بما يكفي، وصمدت في السوق الضعيف.'; cls = 'win'; }
  else if (A.mean < T.drop || Wk.mean < 0) { verdict = 'تسقط H: التفوق غير كافٍ أو خسرت في السوق الضعيف.'; cls = 'loss'; }
  else verdict = 'غير حاسم: نواصل حتى يتضح الفرق.';
  return { A, Wk, verdict, cls };
}

  return { entry: D.entry, limit: false, stopPct: D.stopPct, targetPct: D.targetPct };
}

    <p><b>B</b> مشاركة موزعة: الحجم وعدد الصفقات يرتفعان معًا، بلا صفقات ضخمة مشبوهة.</p>
    <p><b>C</b> قوة أمام BTC: تتفوق على البيتكوين خلال 3 و7 أيام.</p>
    <p><b>D</b> صفقة صالحة: Supertrend 4H إيجابي، ووقف لا يقل عن ${V.stopAtr}×ATR، وهدف واقعي (أقرب مقاومة بحد أقصى ${V.reachAtr}×ATR) لا يقل عن ${V.minTarget}%، وعائد/مخاطرة ${V.minRR} أو أكثر. الدخول بأمر limit عند ${V.pullAtr}×ATR تحت السعر الحالي (صالح ${V.pullTTLh} ساعة)، شرط إلزامي لكل ما يظهر.</p>
    <p>جيد جدًا = D مع B وC. ممتاز = جيد جدًا مع A. جيد = D مع B أو C فقط. A وحدها لا تكفي للترشيح.</p>
    <p>الخطورة: السوق ضعيف (+2)، BTC يهبط الآن (+1)، إشارة واحدة أو لم تجتز الشروط (+1)، اشتباه ضخ أو سيولة استثنائية (+1)، وقف أوسع من ${CFG.RISK.wideStop}% (+1). منخفضة 0–1، متوسطة 2، عالية 3 فأكثر. القرار والحجم لك.</p>
    <p>القوة النسبية: نسبة العملات التي تتفوق عليها خلال 7 و14 يومًا. تُسجَّل للاختبار ولا تدخل في التصنيف بعد.</p>
    <p>قيد المراقبة = أعلى 3 تقييمًا من العملات التي لم تجتز الشروط، مع ما ينقص كل واحدة. ليست جاهزة للدخول. تُسجَّل في السجل كفئة مستقلة.</p></details>`;
  return html;
}

function journalHTML() {
  const vp = PLN[S.vp] ? S.vp : 'P';
  const pending = S.journal.filter(j => !j.pl).length;
  let html = `<button class="btn" data-action="backfill" ${S.bf || S.running ? 'disabled' : ''}>${S.bf ? 'جلب الشموع ' + S.bf.done + '/' + S.bf.n : 'تحليل رجعي للسجل' + (pending ? ' (' + pending + ')' : '')}</button>
  ${S.bfMsg ? `<p class="help">${esc(S.bfMsg)}</p>` : `<p class="help">يجلب شموع كل صفقة قديمة ويعيد اختبارها بالخطط البديلة. لا يحتاج إلا اتصالك بـ Binance.</p>`}`;

  const ht = hTest();
  html += `<h3>اختبار H مقابل المعتمد</h3>
    <div class="note"><b class="${ht.cls}">${esc(ht.verdict)}</b>
    <div class="jrow"><span>الفرق لكل مسح (كل الأسواق)</span><span class="num">${ht.A.scans ? fmtRci({ n: 1, mean: ht.A.mean, ci: ht.A.ci }) : '—'}</span></div>
    <div class="jrow"><span>الفرق في السوق الضعيف</span><span class="num">${ht.Wk.scans ? fmtRci({ n: 1, mean: ht.Wk.mean, ci: ht.Wk.ci }) : '—'}</span></div>
    <p class="help">تُعتمد إذا تفوقت بـ +${CFG.TEST.adopt}R فأكثر وكانت أفضل في السوق الضعيف. تسقط إذا قل التفوق عن +${CFG.TEST.drop}R أو خسرت في السوق الضعيف. الصفقات الجديدة فقط.</p></div>`;

  const row = (lb, s, extra) => `<tr><td>${lb}${extra || ''}</td><td class="num">${s.scans}</td><td class="num">${s.trades}</td><td class="num ${s.n ? (s.mean > 0 ? 'win' : 'loss') : ''}">${fmtRci(s)}</td></tr>`;
  const head = first => `<table><thead><tr><th>${first}</th><th>مسوح</th><th>صفقات</th><th>R لكل إشارة</th></tr></thead><tbody>`;
  html += `<h3>مقارنة الخطط على نفس الإشارات</h3>${head('الخطة')}
  ${PLANS.map(k => { const s = planStats(k); return row(PLN[k], s, s.nofill ? `<div class="muted" style="font-size:11.5px">لم يُنفَّذ ${s.nofill}</div>` : ''); }).join('')}
  </tbody></table>
  <p class="help">R لكل إشارة بعد رسوم ${CFG.fee}%، والإشارة التي لم يُنفَّذ أمرها = 0. الرقم بعد ± هو فترة ثقة 95%: إذا تداخلت فترتا خطتين فالفرق بينهما قد يكون صدفة. صفقات المسح الواحد تتحرك معًا، فالمسح هو المشاهدة المستقلة.</p>
  <div class="seg">${PLANS.map(k => `<button class="btn ${vp === k ? 'on' : ''}" data-action="vp" data-plan="${k}">${PLN[k]}</button>`).join('')}</div>
  <p class="help">الجداول والقوائم أدناه تعرض الخطة المختارة.</p>`;

  const groups = (title, first, rows) => `<h3>${title}</h3>${head(first)}${rows.map(([lb, f]) => row(lb, planStats(vp, f))).join('')}</tbody></table>`;
  html += groups('هل ملاحظة الخطورة صادقة؟', 'الخطورة', ['low', 'mid', 'high'].map(lv => [RISK_W[lv], j => j.rk && j.rk.lv === lv]));
  html += groups('هل القوة النسبية تتنبأ؟', 'الترتيب', [[80, 101, 'أقوى 20%'], [50, 80, 'الوسط الأعلى'], [0, 50, 'النصف الأضعف']].map(([a, b, lb]) => [lb, j => j.f && j.f.rs != null && j.f.rs >= a && j.f.rs < b]));
  html += groups('حسب السوق', 'السوق', [['قوي', j => j.f && j.f.mk && !weakMk(j)], ['ضعيف', weakMk]]);
  html += groups('أداء كل فئة', 'الفئة', [3, 2, 1, 0].map(t => [TIER[t], j => j.tier === t]));
  const riskOfJ = j => { const p = j.pl && (j.pl[vp] || j.pl.W); return p && p.s ? ((p.e || p.lo || j.entry) - p.s) / (p.e || p.lo || j.entry) * 100 : (j.entry - j.stop) / j.entry * 100; };
  html += groups('حسب مسافة الوقف', 'الوقف', [['أقل من 8%', j => riskOfJ(j) < 8], ['8–12%', j => riskOfJ(j) >= 8 && riskOfJ(j) < 12], ['12% فأكثر', j => riskOfJ(j) >= 12]]);
  html += `<p class="help">هذه الجداول للمراقبة لا للتعديل: لا نغيّر قاعدة بناءً على خلية واحدة. كل صفقة تُغلق عند الوقف أو الهدف أو بعد ${CFG.journal.horizonDays} أيام بسعر الإغلاق.</p>`;

  const res = j => { const a = vp === 'A' ? (j.status === 'open' ? null : j) : j.alt && j.alt[vp]; return a; };
  const openJ = S.journal.filter(j => { const a = res(j); return !a || a.status === 'open' || a.status === 'pending'; }).sort((a, b) => b.t - a.t);
  const doneJ = S.journal.filter(j => { const a = res(j); return a && a.status !== 'open' && a.status !== 'pending'; }).sort((a, b) => (res(b).closeT || b.t) - (res(a).closeT || a.t)).slice(0, 40);
  const lbl = { win: 'ربح', loss: 'خسارة', expired: 'انتهت المدة', nofill: 'لم يُنفَّذ' };
  html += `<h3>مفتوحة (<span class="num">${openJ.length}</span>)</h3>`;
  html += openJ.length ? openJ.map(j => `<div class="jrow"><span><b class="num">${esc(j.sym.replace('USDT', ''))}</b> ${TIER[j.tier]}</span><span class="muted">${ago(j.t)}</span></div>`).join('') : `<p class="help">تُضاف كل فرصة تظهر في المسح تلقائيًا.</p>`;
  html += `<h3>مغلقة مؤخرًا</h3>`;
  html += doneJ.length ? doneJ.map(j => { const a = res(j), r = planR(j, vp); const cls = a.status === 'nofill' ? 'exp' : r > 0 ? 'win' : 'loss';
    return `<div class="jrow"><span><b class="num">${esc(j.sym.replace('USDT', ''))}</b> ${TIER[j.tier]}</span><span class="${cls}">${lbl[a.status] || a.status}${a.status === 'nofill' ? '' : ` <span class="num">${fmtR(r)}</span> <span class="muted num">${(a.days || 0).toFixed(1)}ي</span>`}</span></div>`; }).join('') : `<p class="help">لا توجد نتائج بعد. تُقيَّم الصفقات المفتوحة مع كل مسح.</p>`;
  html += `<h3>نسخة احتياطية</h3>
    <button class="btn" data-action="export">نسخ السجل</button>
    <button class="btn" data-action="exportCandles" ${S.bf || S.running ? 'disabled' : ''}>جلب الشموع للتحليل</button>
    ${S.exportText ? `<button class="btn" data-action="copyText">نسخ النص</button>` : ''}
    <button class="btn" data-action="showImport">استيراد</button>
    ${S.exportText ? `<textarea readonly>${esc(S.exportText)}</textarea><p class="help">إذا لم يُنسخ تلقائيًا، حدّد النص وانسخه يدويًا. الصقه في محادثة Claude لتحليل الأداء ومعايرة العتبات.</p>` : ''}
    ${S.showImport ? `<textarea id="importBox" placeholder="الصق نسخة السجل هنا"></textarea><button class="btn" data-action="doImport">دمج في السجل</button>` : ''}
    ${S.msg ? `<p class="help">${esc(S.msg)}</p>` : ''}
    <div><button class="btn danger" data-action="resetJournal">مسح السجل بالكامل</button></div>`;
  return html;
}

const WORKER = `export default {
  async fetch(req) {
    const u = new URL(req.url);
    if (!u.pathname.startsWith('/api/v3/')) return new Response('no', { status: 404 });
    const r = await fetch('https://data-api.binance.vision' + u.pathname + u.search);
    const h = new Headers(r.headers);
    h.set('Access-Control-Allow-Origin', '*');
    return new Response(r.body, { status: r.status, headers: h });
  }
};`;

function settingsHTML() {
  const s = S.settings, V = CFG.V2;
  return `<label for="rkBox">مخاطرة الصفقة بالدولار</label>
    <input id="rkBox" type="text" inputmode="decimal" value="${esc(s.riskUsd)}">
    <p class="help">للاسترشاد فقط: يعرض على كل بطاقة الحجم الذي يخسر هذا المبلغ عند الوقف. القرار لك.</p>
    <label for="exBox">عملات مستبعدة دائمًا (ميم أو أي عملة لا تثق بها)</label>
    <textarea id="exBox">${esc(s.exclude)}</textarea>
    <p class="help">اكتب رمز العملة فقط، وافصل بفاصلة. العملات المستقرة وBTC مستبعدة تلقائيًا.</p>
    <label for="pxBox">رابط الوسيط (اختياري)</label>
    <input id="pxBox" type="text" placeholder="https://radar.yourname.workers.dev" value="${esc(s.proxy || '')}">
    <p class="help">اتركه فارغًا إلا إذا فشل اختبار الاتصال.</p>
    <button class="btn" data-action="saveSettings">حفظ</button>
    <button class="btn" data-action="testConn">اختبار الاتصال</button>
    ${S.conn ? `<ul class="conn">${S.conn.map(c => `<li>${c.ok ? '✓' : '✗'} ${esc(c.base.replace('https://', ''))} ${esc(c.note)}</li>`).join('')}</ul>
      <p class="help">${S.conn.some(c => c.ok) ? 'الاتصال يعمل. لا تحتاج وسيطًا.' : 'كل المصادر محجوبة من هذا المتصفح. أنشئ الوسيط أدناه والصق رابطه في الحقل أعلاه.'}</p>` : ''}
    ${S.msg && S.tab === 'settings' ? `<p class="help">${esc(S.msg)}</p>` : ''}
    <details class="legend"><summary>إنشاء وسيط مجاني عند الحاجة فقط</summary>
      <p>من Safari: dash.cloudflare.com ← Workers &amp; Pages ← Create ← Hello World ← Edit code. الصق الكود التالي ثم Deploy، وانسخ الرابط الناتج إلى حقل الوسيط.</p>
      <pre>${esc(WORKER)}</pre>
      <p>الوسيط يقبل مسارات بيانات السوق العامة فقط، ولا يحمل أي مفاتيح.</p></details>
    <details class="legend"><summary>العتبات الحالية</summary>
      <p>A: شراء taker ≥ ${CFG.A.ratio * 100}% خلال ${CFG.A.hours} ساعة، وحركة بين ${CFG.A.minMove}% و${CFG.A.maxMove}%.</p>
      <p>B: الحجم ≥ ×${CFG.B.vol}، عدد الصفقات يتبعه بنسبة ${CFG.B.follow * 100}%، حجم الصفقة ≤ ×${CFG.B.size}. اشتباه ضخ فوق ×${CFG.B.suspect}.</p>
      <p>D: وقف = الأوسع بين آخر قاع و${V.stopAtr}×ATR وبحد أقصى ${V.maxStop}%، هدف = أقرب مقاومة بحد أقصى ${V.reachAtr}×ATR، هدف ≥ ${V.minTarget}%، عائد/مخاطرة ≥ ${V.minRR}.</p>
      <p>الدخول: أمر limit عند ${V.pullAtr}×ATR تحت السعر لمدة ${V.pullTTLh} ساعة. قيد الاختبار في السجل (H): limit عند −${V.pullAtr}×ATR أو اختراق عند +${V.brkAtr}×ATR، أيهما أولًا، ثم وقف يلحق أعلى سعر بمسافة ${V.trailAtr}×ATR بعد تحرك +${V.actAtr}×ATR، بلا هدف. كل الخطط تُقاس بعد رسوم ${CFG.fee}%.</p>
      <p>الخطورة: BTC تحت متوسط 50 يومًا أو 24 ساعة ≤ ${CFG.RISK.btcDay}% أو اتساع أقل من ${CFG.RISK.breadth}% (+2)، BTC أربع ساعات ≤ ${CFG.RISK.btc4h}% (+1)، وقف أوسع من ${CFG.RISK.wideStop}% (+1).</p>
      <p>الفلاتر: حجم ≥ $5M (أو $1.5M مع دخول حجم صحي ×${CFG.B.surge})، صعود يومي ≤ ${CFG.chaseMax}%، فارق سعري ≤ ${CFG.spreadMax}%، عمر ≥ ${CFG.minDays} يومًا.</p>
      <p>قيد المراقبة: أعلى ${CFG.near.max} تقييمًا بلا حد أدنى. مدة الصفقة في السجل ${CFG.journal.horizonDays} أيام.</p>
      <p>هذه قيم ابتدائية. تُعدَّل بعد تحليل السجل فقط.</p></details>`;
}

function renderScanArea() { const n = document.getElementById('scanArea'); if (n) n.innerHTML = scanAreaHTML(); }
function render() {
  const body = S.tab === 'picks' ? picksHTML() : S.tab === 'journal' ? journalHTML() : settingsHTML();
  el().innerHTML = `<main class="wrap">${regimeHTML()}<div id="scanArea">${scanAreaHTML()}</div>${body}</main>`;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
}

/* ===================== التفاعل ===================== */
async function testConn() {
  S.conn = []; S.msg = null; render();
  for (const b of baseList()) {
    let ok = false, note = '';
    try { const r = await fetchT(b + '/api/v3/ping', 8000); ok = r.ok; note = r.ok ? 'يعمل' : 'رد ' + r.status; }
    catch (e) { note = 'محجوب أو غير متاح'; }
    S.conn.push({ base: b, ok, note });
    if (ok && !S.base) S.base = b;
    render();
  }
}
function onClick(e) {
  const tabBtn = e.target.closest('.tabs button');
  if (tabBtn) { S.tab = tabBtn.dataset.tab; S.msg = null; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const act = a.dataset.action;
  if (act === 'scan') scan();
  else if (act === 'toggle') { if (e.target.closest('a')) return; S.open[a.dataset.sym] = !S.open[a.dataset.sym]; render(); }
  else if (act === 'vp') { S.vp = a.dataset.plan; render(); }
  else if (act === 'backfill') backfill();
  else if (act === 'exportCandles') exportCandles();
  else if (act === 'copyText') {
    const done = ok => { S.msg = ok ? 'نُسخ النص. الصقه الآن في المحادثة.' : 'تعذر النسخ التلقائي. اضغط داخل المربع، حدّد الكل، ثم انسخ.'; render(); };
    const ta = document.querySelector('textarea[readonly]');
    if (navigator.clipboard && S.exportText) navigator.clipboard.writeText(S.exportText).then(() => done(true)).catch(() => done(false));
    else done(false);
  }
  else if (act === 'saveSettings') {
    const rk = parseFloat(document.getElementById('rkBox').value);
    S.settings = {
      exclude: document.getElementById('exBox').value,
      proxy: document.getElementById('pxBox').value.trim(),
      riskUsd: isFinite(rk) && rk > 0 ? rk : 10,
    };
    S.base = null; store.set('settings', S.settings); S.msg = 'حُفظت الإعدادات. تُطبَّق في المسح القادم.'; render();
  }
  else if (act === 'testConn') testConn();
  else if (act === 'export') {
    S.exportText = JSON.stringify({ app: 'radar-v2', exported: new Date().toISOString(), cfg: CFG, journal: S.journal });
    S.msg = null;
    if (navigator.clipboard) navigator.clipboard.writeText(S.exportText).then(() => { S.msg = 'نُسخ السجل. الصقه في ملاحظاتك أو في محادثة Claude.'; render(); }).catch(() => render());
    render();
  }
  else if (act === 'showImport') { S.showImport = true; render(); }
  else if (act === 'doImport') {
    try {
      const data = JSON.parse(document.getElementById('importBox').value);
      const list = Array.isArray(data) ? data : data.journal;
      if (!Array.isArray(list)) throw new Error();
      const ids = new Set(S.journal.map(j => j.id)); let added = 0;
      for (const j of list) if (j && j.id && j.sym && !ids.has(j.id)) { S.journal.push(j); added++; }
      store.set('journal', S.journal); S.showImport = false; S.msg = 'أُضيفت ' + added + ' صفقة إلى السجل. اضغط "تحليل رجعي للسجل" لتحليل الجديد منها.';
    } catch (err) { S.msg = 'النص غير صالح. الصق النسخة كما هي دون تعديل.'; }
    render();
  }
  else if (act === 'resetJournal') {
    if (confirm('سيُحذف السجل بالكامل ولا يمكن استرجاعه إلا من نسخة احتياطية. متابعة؟')) { S.journal = []; store.set('journal', S.journal); S.msg = 'حُذف السجل.'; render(); }
  }
}

if (typeof document !== 'undefined' && document.getElementById) {
  loadState();
  document.addEventListener('click', onClick);
  render();
  setInterval(() => { if (!S.running && (Date.now() < S.cooldownUntil + 1500 || Date.now() < S.haltUntil + 1500)) renderScanArea(); }, 1000);
}
if (typeof module !== 'undefined') module.exports = { analyze, grade, regimeOf, supertrend, atrSeries, ema, resistances, parseK, closedK, buildPlans, simStd, simH, simPull, runSim, planStats, planR, clustered, hTest, riskOf, rsRanks, entryPlan, CFG, S };
